[build]
  publish = "."

# Trailing-slash redirects for clean directory URLs
[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301
  force = false

[[redirects]]
  from = "/service-areas"
  to = "/service-areas/"
  status = 301
  force = false

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301
  force = false

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301
  force = false

# Retired campaign page — redirect to homepage
[[redirects]]
  from = "/americas-250"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/americas-250/"
  to = "/"
  status = 301
  force = true
