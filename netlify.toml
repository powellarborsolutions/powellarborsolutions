# Duplicate /index.html URLs -> canonical directory URLs (live check 2026-10-05:
# Netlify served these as 200 duplicates). Only the exact /index.html paths match,
# so requests for the canonical "/" or "/dir/" URLs are never redirected (no loop).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/index.html"
  to = "/about/"
  status = 301
  force = true

