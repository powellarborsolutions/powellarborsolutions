[build]
  publish = "."

# Serverless functions (live Google rating/review count — see CHANGELOG 2026-10-05)
[functions]
  directory = "netlify/functions"

# Trailing-slash redirects for clean directory URLs
[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301
  force = false

[[redirects]]
  from = "/service-areas"
  to = "/service-areas/"
  status = 301
  force = false

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301
  force = false

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301
  force = false

# Retired campaign page — redirect to homepage
[[redirects]]
  from = "/americas-250"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/americas-250/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/financing"
  to = "/financing/"
  status = 301
  force = false

# Seasonal campaign page (2026-27 El Nino storm preparedness)
[[redirects]]
  from = "/el-nino-tree-preparation"
  to = "/el-nino-tree-preparation/"
  status = 301
  force = false

# Legacy .html URLs -> clean extensionless URLs (the canonical format).
# Netlify serves /dir/page.html at /dir/page automatically; these forced 301s make
# the clean URL the only indexable version. Keep in sync with sitemap.xml.
